services:
  sydney-fishing:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: sydney-fishing
    restart: unless-stopped
    environment:
      - TZ=Australia/Sydney
      - APP_DATA_DIR=/app/data
      - TIDECHECK_API_KEY=${TIDECHECK_API_KEY:-}
      - TIDECHECK_STATION_ID=${TIDECHECK_STATION_ID:-}
      # If you later want Turso, uncomment and set these:
      # - TURSO_DATABASE_URL=
      # - TURSO_AUTH_TOKEN=
    volumes:
      - ../../data:/app/data
    ports:
      - "127.0.0.1:8501:8501"
